
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyApp</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark">M</span>
          <span>MyApp</span>
        </div>

        <nav aria-label="Основная навигация">
          <button class="btn-secondary" type="button" data-open="login">
            Авторизация
          </button>
          <button class="btn-primary" type="button" data-open="register">
            Регистрация
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">Рады вас видеть</div>
        <h1>Добро пожаловать!</h1>

        <p>
          Войдите или зарегистрируйтесь, чтобы продолжить
          и открыть все возможности MyApp.
        </p>

        <div class="hero-actions">
          <button class="btn-primary" type="button" data-open="login">
            Войти в аккаунт
          </button>
          <button class="btn-secondary" type="button" data-open="register">
            Создать аккаунт
          </button>
        </div>

        <div class="note">
          Простой и удобный старт — всё в одном месте.
        </div>
      </section>
    </main>
  </div>

  <!-- Окно авторизации -->
  <div
    class="overlay"
    id="login"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-title"
  >
    <section class="modal">
      <div class="modal-head">
        <h2 id="login-title">Авторизация</h2>
        <button class="close" type="button" aria-label="Закрыть">
          ×
        </button>
      </div>

      <form data-form="login">
        <div class="field">
          <label for="login-name">Логин</label>
          <input
            id="login-name"
            name="login"
            autocomplete="username"
            placeholder="Введите логин"
            required
          >
        </div>

        <div class="field">
          <label for="login-password">Пароль</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Введите пароль"
            required
          >
        </div>

        <button class="btn-primary submit" type="submit">
          Войти
        </button>

        <p class="message" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <!-- Окно регистрации -->
  <div
    class="overlay"
    id="register"
    role="dialog"
    aria-modal="true"
    aria-labelledby="register-title"
  >
    <section class="modal">
      <div class="modal-head">
        <h2 id="register-title">Регистрация</h2>
        <button class="close" type="button" aria-label="Закрыть">
          ×
        </button>
      </div>

      <form data-form="register">
        <div class="field">
          <label for="first-name">Имя</label>
          <input
            id="first-name"
            name="firstName"
            autocomplete="given-name"
            placeholder="Введите имя"
            required
          >
        </div>

        <div class="field">
          <label for="last-name">Фамилия</label>
          <input
            id="last-name"
            name="lastName"
            autocomplete="family-name"
            placeholder="Введите фамилию"
            required
          >
        </div>

        <div class="field">
          <label for="register-login">Логин</label>
          <input
            id="register-login"
            name="login"
            autocomplete="username"
            placeholder="Придумайте логин"
            required
          >
        </div>

        <div class="field">
          <label for="register-password">Пароль</label>
          <input
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Придумайте пароль"
            required
          >
        </div>

        <button class="btn-primary submit" type="submit">
          Зарегистрироваться
        </button>

        <p class="message" aria-live="polite"></p>
      </form>
    </section>
  </div>
</body>
</html>
